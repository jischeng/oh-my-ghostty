name: OMGMobile
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  TermioShared:
    path: Vendor/TermioShared
  GhosttyKit:
    path: Vendor/libghostty-swift
  Highlightr:
    path: Vendor/Highlightr
settings:
  base:
    SWIFT_VERSION: "5.9"
    SDKROOT: iphoneos
    OMG_MOBILE_BUNDLE_ID: com.jischeng.omg.mobile
    MARKETING_VERSION: "0.20.0"
    CURRENT_PROJECT_VERSION: "50"
    HEADER_SEARCH_PATHS: "$(SRCROOT)/.build/headers"
    SWIFT_INCLUDE_PATHS: "$(SRCROOT)/GhosttyVt"
    OTHER_LDFLAGS: "$(inherited) -lghostty-vt -lc++"
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/.build/vt/iphoneos"
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/.build/vt/iphonesimulator"
targets:
  TermioStream:
    type: framework
    platform: iOS
    sources:
      - path: Vendor/TermioStream
        excludes: ["Resources"]
      - path: Vendor/TermioStream/Resources/SymbolsNerdFontMono-Regular.ttf
        buildPhase: resources
    dependencies:
      - package: TermioShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OMG_MOBILE_BUNDLE_ID).stream"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  OMGMobile:
    type: application
    platform: iOS
    sources:
      - Sources
      - Core
      - Assets.xcassets
      - path: Licenses
        buildPhase: resources
      - path: Vendor/Termio
        excludes: ["*.md", "LICENSE.termio"]
      - path: Vendor/TermioApp
      - path: Vendor/TermioStream/Resources/SymbolsNerdFontMono-Regular.ttf
        buildPhase: resources
      - path: Vendor/Termio/LICENSE.termio
        buildPhase: resources
      - path: ../LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OMG_MOBILE_BUNDLE_ID)"
        PRODUCT_NAME: OMGMobile
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TermioStream
      - package: TermioShared
      - package: Highlightr
      - package: GhosttyKit
        product: GhosttyTerminal
      - package: GhosttyKit
        product: GhosttyTheme
      - package: GhosttyKit
        product: ShellCraftKit
    info:
      path: .build/Info.plist
      properties:
        CFBundleDisplayName: OMG Mobile
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIAppFonts:
          - SymbolsNerdFontMono-Regular.ttf
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).OMGSceneDelegate"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "连接局域网内的 Mac，查看和操作 OMG 终端会话。"
        NSCameraUsageDescription: "扫描设备配对二维码或拍摄要发送的照片。"
        NSMicrophoneUsageDescription: "录制语音并转写输入内容。"
        NSSpeechRecognitionUsageDescription: "在设备上将录音转写为文字。"
        NSPhotoLibraryUsageDescription: "选择要发送的照片。"
        CFBundleURLTypes:
          - CFBundleURLName: "$(OMG_MOBILE_BUNDLE_ID)"
            CFBundleURLSchemes: [omg]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  OMGMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: OMGMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OMG_MOBILE_BUNDLE_ID).uitests"
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET_NAME: OMGMobile
        OMG_MOBILE_UI_SERVER: "127.0.0.1:18790"
        OMG_MOBILE_UI_SESSION: "77777777-1111-2222-3333-444444444444"
        OMG_MOBILE_UI_VM: "NO"
        OMG_MOBILE_UI_PROJECT: ""
        OMG_MOBILE_UI_DIRECTORY: ""
    info:
      path: .build/UITest-Info.plist
      properties:
        OMGTestServer: "$(OMG_MOBILE_UI_SERVER)"
        OMGTestSession: "$(OMG_MOBILE_UI_SESSION)"
        OMGTestVM: "$(OMG_MOBILE_UI_VM)"
        OMGTestProject: "$(OMG_MOBILE_UI_PROJECT)"
        OMGTestDirectory: "$(OMG_MOBILE_UI_DIRECTORY)"
schemes:
  OMGMobile:
    build:
      targets:
        OMGMobile: all
        OMGMobileUITests: [test]
    test:
      targets: [OMGMobileUITests]
