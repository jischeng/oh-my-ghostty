name: Feature request / 功能建议
description: Explain an OMG workflow you would like to improve.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. See the [reporting guide](https://github.com/jischeng/oh-my-ghostty/blob/main/docs/REPORTING.md).
        A new feature request does not need logs or a verified installed version. Bugs in existing behavior belong in the bug form.
        English and Chinese are welcome; please keep private workflow details and prompts redacted.
  - type: textarea
    id: workflow
    attributes:
      label: Workflow and current difficulty / 工作流与当前困难
      description: What are you trying to do, and what makes it awkward now?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome / 期望效果
      description: A concrete example is helpful. An implementation design is optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or related issues / 替代方案或关联问题
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / 提交前检查
      options:
        - label: I reviewed this request and removed private or sensitive information. / 我已检查并移除敏感信息。
          required: true
  - type: textarea
    id: ai_assistance
    attributes:
      label: AI assistance, if any / AI 辅助说明（如有）
      description: Name the tool and scope of assistance; confirm you reviewed the request. Leave blank if not used.
