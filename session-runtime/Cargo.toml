[package]
name = "omg-session-runtime"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
tokio-tungstenite = "0.28"

[[bin]]
name = "omgd"
path = "src/main.rs"
