name: Bug report / 问题反馈
description: Report one reproducible or intermittent OMG problem. English and Chinese are welcome.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Search existing issues and read the [reporting guide](https://github.com/jischeng/oh-my-ghostty/blob/main/docs/REPORTING.md) first.
        This is the OMG tracker, not official Ghostty. Please do not paste secrets, full logs, private prompts, or unredacted screenshots.
        不确定的信息请填写“未知”，不要猜测版本或根因；Issue 是公开的。
  - type: input
    id: version
    attributes:
      label: OMG version and build / 版本与构建
      description: Use the installed app's About/Info.plist, not the checkout version. Include the Ghostty base if available.
      placeholder: "OMG 0.x.y / build N; Ghostty base ...; or unknown"
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Application / 应用
      options:
        - Release OMG.app
        - OMG Dev.app
        - Built from source
        - Unknown
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version / 系统版本
      placeholder: "macOS version, or unknown"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture / 架构
      options:
        - Apple Silicon (arm64)
        - Intel (x86_64)
        - Unknown
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 期望与实际行为
      description: Describe what you observed. Keep theories separate from facts.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, frequency and context / 操作、频率与场景
      description: Include local/SSH, Agent, splits or relevant settings. For intermittent events, add time and timezone. Unknown steps are acceptable.
      placeholder: |
        1.
        2.
        Frequency:
        Time/timezone (if relevant):
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence / 脱敏证据
      description: Short relevant log excerpt, crash details or screenshot. Do not upload full history/config/environment or whole unified-log dumps. Explain if unavailable.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / 提交前检查
      options:
        - label: I reviewed this report and removed secrets, private prompts and unnecessary personal information. / 我已检查并移除敏感信息。
          required: true
  - type: textarea
    id: ai_assistance
    attributes:
      label: AI assistance, if any / AI 辅助说明（如有）
      description: Name the tool and scope of assistance; confirm you reviewed the report. Leave blank if not used.
